# Color de fondo de la página principal
backgroundColor = "#121212"

# Color de fondo secundario (para la barra lateral o cajitas)
secondaryBackgroundColor = "#2B2622"

# Color de las letras
textColor = "#E0E0E0"

# Tipo de letra 
font = "sans serif"